<script>
(function() {
    function dummyBreak(fn) {
        if (typeof fn === 'function') fn();
        return Promise.resolve(true);
    }
    window.commercialBreak = window.commercialBreak || dummyBreak;
    window.rewardedBreak = window.rewardedBreak || dummyBreak;
    try {
        if (window.parent && window.parent !== window) {
            window.parent.commercialBreak = window.parent.commercialBreak || dummyBreak;
            window.parent.rewardedBreak = window.parent.rewardedBreak || dummyBreak;
        }
        if (window.top && window.top !== window) {
            window.top.commercialBreak = window.top.commercialBreak || dummyBreak;
            window.top.rewardedBreak = window.top.rewardedBreak || dummyBreak;
        }
    } catch(e) {}
})();
</script>
