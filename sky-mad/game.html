<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function() {
    function dummyBreak(fn) {
        if (typeof fn === 'function') fn();
        return Promise.resolve(true);
    }
    window.commercialBreak = window.commercialBreak || dummyBreak;
    window.rewardedBreak = window.rewardedBreak || dummyBreak;
    try {
        if (window.parent && window.parent !== window) {
            window.parent.commercialBreak = window.parent.commercialBreak || dummyBreak;
            window.parent.rewardedBreak = window.parent.rewardedBreak || dummyBreak;
        }
        if (window.top && window.top !== window) {
            window.top.commercialBreak = window.top.commercialBreak || dummyBreak;
            window.top.rewardedBreak = window.top.rewardedBreak || dummyBreak;
        }
    } catch(e) {}
})();
</script>
  <script>window.open = function () {}; window.NOSW = true;</script>

<body onload=init() bgcolor=#121F2C link=#D3F2FF alink=#D3F2FF vlink=#D3F2FF leftmargin=0 topmargin=0 margin=0 marginheight=0 marginwidth=0>

<table id=loading style="position: absolute; left: 0px; top: 0px; width: 100%; height: 100%"><td valign=center align=center><span style='font-family:Verdana, Arial; font-size:14px;'><font color=#009CEC><b>Loading, please wait...</b></font></span></td></table>

<canvas id="canvas3D" style="position: absolute; left: 0px; top: 0px; padding-left: 0; padding-right: 0; margin-right: auto; margin-left: auto; display: block; width: 1280px; height: 720px;" width=1280 height=720></canvas>
<canvas id="canvas2D" style="position: absolute; left: 0px; top: 0px; padding-left: 0; padding-right: 0; margin-right: auto; margin-left: auto; display: block; width: 1280px; height: 720px;" width=1280 height=720></canvas>

<script>

var canvas3D=document.querySelector('#canvas3D');
var gl=( canvas3D.getContext('webgl') || canvas3D.getContext('experimental-webgl') );

var canvas2D=document.querySelector('#canvas2D');
canvas2D.addEventListener("mousedown",msdown,false);
canvas2D.addEventListener('mousemove',msmove,false);
canvas2D.addEventListener("mouseup",msup,false);
canvas2D.addEventListener('mouseout',msout,false);
canvas2D.addEventListener('touchmove',frmove,false);
canvas2D.addEventListener('touchstart',frdown,false);
canvas2D.addEventListener('touchend',frup,false);
var rd=canvas2D.getContext('2d');


var xm=[];
var ym=[];
var nms=0;
var xmvr=0;
var mdown=false;
var mdowncnt=0;
var space=0;


function msmove(evt)
{
var rect=canvas2D.getBoundingClientRect();
xm[0]=(evt.clientX-rect.left); 
ym[0]=(evt.clientY-rect.top);
nms=1;
xmvr=Math.abs(xm[0]-(canw*0.5));
}

function msdown(evt)
{
var rect=canvas2D.getBoundingClientRect();
xm[0]=(evt.clientX-rect.left); 
ym[0]=(evt.clientY-rect.top);
nms=1;
xmvr=Math.abs(xm[0]-(canw*0.5));
mdown=true;
}

function msup(evt) { mdown=false; mdowncnt=0; checknplay(); }

function msout(evt) { mdown=false; mdowncnt=0; }


function frmove(evt)
{
evt.preventDefault();
var rect=canvas2D.getBoundingClientRect();

nms=0;
for (var i=0;i<evt.touches.length;i++)
{
xm[nms]=(evt.touches[i].clientX-rect.left);
ym[nms]=(evt.touches[i].clientY-rect.top);
nms++;
}
}


function frdown(evt)
{
evt.preventDefault();
var rect=canvas2D.getBoundingClientRect();

nms=0;
for (var i=0;i<evt.touches.length;i++)
{
xm[nms]=(evt.touches[i].clientX-rect.left);
ym[nms]=(evt.touches[i].clientY-rect.top);
mdown=true;
nms++;
}

}

function frup(evt) { evt.preventDefault(); mdown=false; mdowncnt=0; checknplay(); }


function Keydown(evt)
{
evt.preventDefault();

var k=evt.keyCode;

if (!invertcontrols)
{
if (k==38||k==87) { down[0]=true; }
if (k==40||k==83) { up[0]=true; }
}
else
{
if (k==38||k==87) { up[0]=true; }
if (k==40||k==83) { down[0]=true; }
}

if (k==37||k==65) { left[0]=true; }
if (k==39||k==68) { right[0]=true; }
if (k==32)
{
space=1;
if ((fase==7)&&(camode==2)&&(cntstart<250)&&(checkmusic)) { cntstart=250; } 
}

if (k==90) { onpkcnt=10; onpk=0; onpowers=true; }
if (k==88) { onpkcnt=10; onpk=1; onpowers=true; }
if (k==67) { onpkcnt=10; onpk=2; onpowers=true; }
if (k==86) { onpkcnt=10; onpk=3; onpowers=true; }
if (k==66) { onpkcnt=10; onpk=4; onpowers=true; }
} 


function Keyup(evt)
{
evt.preventDefault();

var k=evt.keyCode;

if (!invertcontrols)
{
if (k==38||k==87) { down[0]=false; }
if (k==40||k==83) { up[0]=false; }
}
else
{
if (k==38||k==87) { up[0]=false; }
if (k==40||k==83) { down[0]=false; }
}

if (k==37||k==65) { left[0]=false; }
if (k==39||k==68) { right[0]=false; }

if (k==32) { space=2; }

if (k==90) { onpkcnt=9; onpk=0; }
if (k==88) { onpkcnt=9; onpk=1; }
if (k==67) { onpkcnt=9; onpk=2; }
if (k==86) { onpkcnt=9; onpk=3; }
if (k==66) { onpkcnt=9; onpk=4; }
}



function init() { gameloop(); document.getElementById("loading").style.visibility="hidden"; PokiSDK.init().then(initDone).catch(() => { initDone(); });  }

function initDone() { PokiSDK.gameLoadingStart(); pokiready=true; }

function loadingComplete() { PokiSDK.gameLoadingFinished(); }

function gameplayStart() { notstarted=false; PokiSDK.gameplayStart(); }

function gameplayStop() { PokiSDK.gameplayStop(); }

function showLoadingAd() { PokiSDK.commercialBreak().then(() => { adshow=3; }); }

function showRewardAd() { PokiSDK.rewardedBreak().then((success) => { if(success) { rewadshow=2; } else { rewadshow=3; } }); }



window.addEventListener("keydown",Keydown,false);
window.addEventListener("keyup",Keyup,false);
document.addEventListener("visibilitychange", function() { if ((fase!=5)&&(!rewadshow)) { if (document.visibilityState == "visible") { mutemusic=omutemusic; mutegame=omutegame; } else { omutemusic=mutemusic; omutegame=mutegame; mutemusic=true; mutegame=true; } } } );


</script>
</body>
